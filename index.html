<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sacra練習掲示板</title>
<!-- ホーム画面に追加すると、アプリのように全画面で開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sacra掲示板">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#151515">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* 入口ページ自体はスクロールさせない（iPhoneでは、裏でずれると掲示板を押した位置と反応する位置がずれる。ずれたらすぐ戻す） */
  html, body { margin: 0; height: 100%; background: #151515; overflow: hidden; overscroll-behavior: none; }
  /* 掲示板を画面いっぱい（時計や電池の帯の裏まで）に表示する。帯の高さは掲示板に伝えて、文字が重ならないようにしてもらう */
  /* iPhoneのホーム画面アプリでは「100%」が時計の帯のぶん短くなるので、その分を足して下まで届かせる */
  /* ふつうは今見えている範囲にぴったり（Android など）。iPhone だけは JS（fit）で画面の下の端まで伸ばす */
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }
  #probe { position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<!-- 掲示板本体（Google Apps Script のWebアプリ）を画面いっぱいに表示する -->
<iframe id="board" title="Sacra練習掲示板" allow="clipboard-write"></iframe>
<div id="probe"></div>
<script>
  // 掲示板のログイン情報と着せ替えを、この入口ページに預かる。
  // ホーム画面のアプリとして開くと、iPhoneは埋め込んだ掲示板側の保存データを閉じるたびに消してしまうため
  (function () {
    var KEYS = ['sacra_session', 'sacra_look'];
    var FROM = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/; // 掲示板（GAS）の画面からの依頼だけ受け付ける
    var EXEC = 'https://script.google.com/macros/s/AKfycbwxbNtPd44XtKkLFelMUgYnDQudUnXYAUpHcVlwbuVQzEmTdvd09Z5PM7TymDB4uQ/exec';
    var probe = document.getElementById('probe'), board = document.getElementById('board'), last = null;
    // 掲示板を画面の一番下まで広げる。iPhoneのホーム画面アプリでは「100%」も「100vh」も下のホームバーの所まで届かず、
    // 下に入口ページの地の色（灰色）が見えてしまうことがあるので、画面そのものの高さ（screen）に合わせる
    var mq = function (q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
    var isApp = function () { return !!navigator.standalone || mq('(display-mode: standalone)') || mq('(display-mode: fullscreen)'); };
    var size = {};
    var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    function fit() {
      var portrait = window.innerHeight >= window.innerWidth;
      var sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      if (iOS) {
        // iPhone：表示の高さがホームバーや時計の帯の分だけ短く報告されるので、画面そのものの高さまで伸ばす。
        // ページ自体の高さも同じにしないと、下のホームバーの所で掲示板が切れて描かれない
        var h = Math.max(window.innerHeight + insets().top, document.documentElement.clientHeight, isApp() ? sh : 0);
        board.style.height = h + 'px';
        document.documentElement.style.height = document.body.style.height = h + 'px';
      } else {
        // Android など：今見えている範囲にぴったり合わせる（画面そのものの高さはナビゲーションバーや URL バーも含むので使わない）
        board.style.height = ''; document.documentElement.style.height = document.body.style.height = '';
      }
      if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      var vv = window.visualViewport;
      size = { app: isApp(), inner: window.innerHeight, screen: sh, frame: board.offsetHeight, sy: Math.round(window.scrollY || 0), vt: vv ? Math.round(vv.offsetTop) : 0, vh: vv ? Math.round(vv.height) : 0 }; // 確認用（掲示板の設定画面に出す）
    }
    fit();
    window.addEventListener('load', fit);
    // 何かの拍子に入口ページがずれたら、すぐ元の位置へ戻す
    window.addEventListener('scroll', function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    if (window.visualViewport) window.visualViewport.addEventListener('scroll', function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
    setTimeout(fit, 600);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    function insets() { var cs = getComputedStyle(probe); return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 }; }
    // 掲示板を開くとき、時計の帯（上）とホームバー（下）の高さをURLで伝える
    var ins = insets();
    document.getElementById('board').src = EXEC + '?st=' + Math.round(ins.top) + '&sb=' + Math.round(ins.bottom);
    // 画面の向きが変わったら帯の高さを伝え直す
    window.addEventListener('resize', function () { fit(); if (last) try { last.source.postMessage({ sacra: 'inset', inset: insets() }, last.origin); } catch (err) {} });
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!FROM.test(e.origin) || !d || typeof d !== 'object') return;
      try {
        if (d.sacra === 'get') {
          var values = {};
          KEYS.forEach(function (k) { values[k] = localStorage.getItem(k) || ''; });
          last = { source: e.source, origin: e.origin };
          fit(); e.source.postMessage({ sacra: 'data', values: values, inset: insets(), size: size }, e.origin);
        } else if (d.sacra === 'bar' && /^#[0-9A-Fa-f]{6}$/.test(d.color)) {
          // 枠の外に見える所（下のすき間など）は掲示板の背景と同じ色にする（灰色にしない）
          var bg = /^#[0-9A-Fa-f]{6}$/.test(d.bg) ? d.bg : d.color;
          document.documentElement.style.background = bg; document.body.style.background = bg;
          var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', d.color);
        } else if (d.sacra === 'set' && KEYS.indexOf(d.key) >= 0) {
          if (d.value) localStorage.setItem(d.key, String(d.value)); else localStorage.removeItem(d.key);
        }
      } catch (err) {}
    });
  })();
</script>
</body>
</html>
