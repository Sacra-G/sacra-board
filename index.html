<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sacra練習掲示板</title>
<!-- ホーム画面に追加すると、アプリのように全画面で開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sacra掲示板">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#151515">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #151515; overflow: hidden; }
  /* 画面上部の時計や電池の帯の下から掲示板を表示する。帯の部分は掲示板の背景色に合わせて塗る */
  iframe { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px); width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; display: block; }
</style>
</head>
<body>
<!-- 掲示板本体（Google Apps Script のWebアプリ）を画面いっぱいに表示する -->
<iframe src="https://script.google.com/macros/s/AKfycbwxbNtPd44XtKkLFelMUgYnDQudUnXYAUpHcVlwbuVQzEmTdvd09Z5PM7TymDB4uQ/exec" title="Sacra練習掲示板" allow="clipboard-write"></iframe>
<script>
  // 掲示板のログイン情報と着せ替えを、この入口ページに預かる。
  // ホーム画面のアプリとして開くと、iPhoneは埋め込んだ掲示板側の保存データを閉じるたびに消してしまうため
  (function () {
    var KEYS = ['sacra_session', 'sacra_look'];
    var FROM = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/; // 掲示板（GAS）の画面からの依頼だけ受け付ける
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!FROM.test(e.origin) || !d || typeof d !== 'object') return;
      try {
        if (d.sacra === 'get') {
          var values = {};
          KEYS.forEach(function (k) { values[k] = localStorage.getItem(k) || ''; });
          e.source.postMessage({ sacra: 'data', values: values }, e.origin);
        } else if (d.sacra === 'bar' && /^#[0-9A-Fa-f]{6}$/.test(d.color)) {
          document.documentElement.style.background = d.color; document.body.style.background = d.color;
          var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', d.color);
        } else if (d.sacra === 'set' && KEYS.indexOf(d.key) >= 0) {
          if (d.value) localStorage.setItem(d.key, String(d.value)); else localStorage.removeItem(d.key);
        }
      } catch (err) {}
    });
  })();
</script>
</body>
</html>
