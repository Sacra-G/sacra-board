<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #EFEFEF; color: #000; font-family: 'MS PGothic', 'ＭＳ Ｐゴシック', 'IPAMonaPGothic', 'Osaka', sans-serif; font-size: 15px; line-height: 1.5; }
  a { color: #0000EE; }
  a:hover { color: #CC0000; }
  #app { max-width: 640px; margin: 0 auto; padding: 12px 10px 40px; display: flex; flex-direction: column; gap: 10px; }
  .head { background: #CCFFCC; border: 1px solid #66AA66; padding: 10px 8px; text-align: center; }
  .head h1 { margin: 0; font-size: 22px; color: #CC0000; }
  .head p { margin: 0; font-size: 13px; color: #333; }
  .box { background: #FFF; border: 1px solid #999; }
  .btn { min-height: 44px; padding: 0 12px; background: #EEE; border: 2px outset #DDD; color: #000; font: inherit; font-size: 14px; cursor: pointer; }
  .btn:active { border-style: inset; }
  .btn.on { background: #FFFFCC; border-style: inset; font-weight: bold; }
  .btn.wide { width: 100%; }
  .btn.big { font-size: 15px; font-weight: bold; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .item { display: flex; flex-direction: column; justify-content: center; min-height: 44px; padding: 6px 8px; border-bottom: 1px dotted #999; text-decoration: none; }
  .item .t { color: #0000EE; text-decoration: underline; }
  .meta { color: #555; font-size: 12px; }
  .red { color: #CC0000; }
  .name { color: #007700; font-weight: bold; }
  .trip { color: #007700; }
  .post { display: flex; flex-direction: column; gap: 4px; }
  .post .h { margin: 0; font-size: 13px; }
  .post .b { margin: 0 0 0 16px; white-space: pre-wrap; word-break: break-word; }
  .post .gone { margin: 0 0 0 16px; color: #777; font-style: italic; }
  .acts { margin-left: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 0; min-height: 40px; color: #0000EE; text-decoration: underline; font: inherit; font-size: 13px; cursor: pointer; }
  .like { min-height: 40px; padding: 0 10px; font-size: 13px; }
  .like.on { background: #FFE0E0; color: #CC0000; font-weight: bold; border-style: inset; }
  .pop { position: fixed; left: 10px; right: 10px; bottom: 16px; max-width: 620px; margin: 0 auto; background: #FFFFE0; border: 1px solid #999; padding: 8px 10px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  form, .form { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  input[type=text], textarea { box-sizing: border-box; width: 100%; border: 2px inset #DDD; padding: 6px; font: inherit; font-size: 16px; background: #FFF; }
  textarea { resize: vertical; }
  .check { flex-direction: row; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; }
  .check input { width: 20px; height: 20px; }
  .count { margin: -4px 0 0; text-align: right; font-size: 13px; color: #333; }
  .note { font-size: 12px; color: #555; }
  .err { background: #FFF0F0; border: 1px solid #CC9999; color: #990000; padding: 8px; font-size: 14px; }
  .loading { text-align: center; color: #555; padding: 30px 0; }
  .nav { display: flex; gap: 12px; align-items: center; min-height: 44px; font-size: 14px; }
  hr { margin: 0; border: 0; border-top: 1px solid #999; }
  .parts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .parts label { flex-direction: row; align-items: center; gap: 4px; min-height: 44px; font-size: 14px; }
  .login { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 10px; }
  .imgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-left: 16px; }
  .imgs a { display: block; border: 1px solid #999; background: #DDD; }
  .imgs img { display: block; width: 100%; height: 140px; object-fit: cover; }
  .previews { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .previews div { position: relative; border: 1px solid #999; }
  .previews img { display: block; width: 100%; height: 70px; object-fit: cover; }
  .previews button { position: absolute; right: 0; top: 0; min-width: 28px; min-height: 28px; border: 0; background: rgba(0,0,0,.6); color: #FFF; font-size: 14px; cursor: pointer; }
  .req { padding: 8px; border-bottom: 1px dotted #999; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  fieldset { margin: 0; border: 1px solid #999; padding: 6px 8px; }
  legend { font-size: 13px; }
  .pgt { margin: 0; font-size: 19px; color: #CC0000; }
  .adminbox { padding: 8px; background: #FFF0F0; border-color: #CC9999; display: flex; flex-direction: column; gap: 6px; }
  .skins label { flex-direction: row; align-items: center; gap: 6px; min-height: 40px; font-size: 14px; }
  .paltabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .paltabs .btn { padding: 0 4px !important; font-size: 13px; white-space: nowrap; }
  .palrow { display: grid; grid-template-columns: 5.5em 48px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; }
  .palrow input[type=color] { width: 48px; height: 36px; padding: 0; border: 1px solid #999; background: none; }
  .ed { color: #555; font-size: 12px; }
  .sec, .lat, #sky, #fx, .orn, .legend { display: none; }
  .origin { font-size: 11px; color: #777; word-break: break-all; text-align: center; }


  /* ══════════ ②〜⑤ 共通（.skn）══════════ */
  .skn #app { position: relative; z-index: 1; padding: 12px 16px 96px; gap: 12px; }
  .skn #sky { display: block; position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .skn #fx { display: block; position: fixed; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; }
  .skn .sec, .skn .legend { display: flex; }
  .skn .lat { display: inline; }
  .skn .ic { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; flex: none; }
  .skn .ic .lf { fill: currentColor; }
  .skn .sacra-logo { display: block; flex: none; -webkit-mask: var(--logo) center/contain no-repeat; mask: var(--logo) center/contain no-repeat; }
  .skn .hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .skn .legend { flex-direction: column; gap: 3px; align-self: flex-start; color: var(--legendInk); font-size: 10px; letter-spacing: .03em; }
  .skn .legend .lgt { margin: 0 0 1px; font-size: 10.5px; letter-spacing: .14em; white-space: nowrap; }
  .skn .legend .sw { display: flex; align-items: center; gap: 4px; }
  .skn .legend .sw i { flex: none; width: 30px; height: 8px; border: 1px solid var(--legendLine); }
  .skn .head { background: none; border: 0; padding: 0; }
  .skn .head h1, .skn .head p { margin: 0; }
  .skn .nav { justify-content: space-between; gap: 8px; }
  .skn .navgap { width: 80px; }
  .skn .navbtn, .skn .btn { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
  .skn .btn.wide { width: 100%; }
  .skn .btn:disabled { opacity: .6; }
  .skn .welcome { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .skn .welcome p { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .skn .sortbox { background: none; border: 0; padding: 0 !important; box-shadow: none; }
  .skn .sortbox .meta { display: none; }
  .skn .sortbox .grid2 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .skn .sortbox .btn { min-height: 40px; padding: 0 2px; font-size: 13px; gap: 4px; }
  .skn .item { flex-direction: row; align-items: flex-start; justify-content: flex-start; gap: 10px; min-height: 48px; padding: 8px 2px; border-bottom: 0; }
  .skn .item .num { flex: none; text-align: center; }
  .skn .item .tt { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .skn .item .t { text-decoration: none; font-size: 14px; line-height: 1.45; }
  .skn .item .rc { display: none; }
  .skn .center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .skn .center .meta { font-size: 12px; }
  .skn .foot { margin: 6px 0 0; text-align: center; }
  .skn .pgt { font-weight: 400; text-align: center; }
  .skn .tbox { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px 16px 16px; }
  .skn .tacts { margin: 0; }
  .skn .post { gap: 8px; padding: 14px 16px 12px; position: relative; }
  .skn .post .h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; }
  .skn .post .sep { display: none; }
  .skn .post .date { flex-basis: 100%; }
  .skn .post .b { margin: 0; font-size: 15px; line-height: 1.85; }
  .skn .post .gone { margin: 4px 0; font-style: normal; }
  .skn .post .form { margin-left: 0 !important; }
  .skn .acts { margin-left: 0; gap: 6px 10px; }
  .skn .acts.tools { padding-top: 6px; }
  .skn .linkbtn { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; text-decoration: none; font-family: inherit; }
  .skn .imgs { margin-left: 0; gap: 8px; }
  .skn .imgs img { height: 118px; }
  .skn .pop { display: flex; flex-direction: column; gap: 3px; z-index: 5; }
  .skn .pop[hidden] { display: none; }
  .skn label { gap: 6px; }
  .skn input[type=text], .skn textarea { min-height: 46px; padding: 10px 14px; font-family: inherit; font-size: 16px; line-height: 1.8; }
  .skn input::placeholder, .skn textarea::placeholder { color: inherit; opacity: .55; }
  .skn fieldset { padding: 8px 12px 10px; }
  .skn legend { padding: 0 6px; }
  .skn .adminbox, .skn .lookbox { display: flex; flex-direction: column; gap: 10px; }
  .skn .palrow input[type=text] { min-height: 38px; padding: 4px 10px; }
  .skn .err { position: relative; z-index: 1; }
  .skn .orn { display: block; position: absolute; pointer-events: none; }
  .skn :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .skn .chips, .skn .attrs, .skn .tlab, .skn .peak, .skn .obsbar { display: none; }

  /* ══════════ ② 太陽と月 ══════════ */
  body.sk-sunmoon { background: var(--bg); color: var(--ink); font-family: 'New Tegomin', 'Hiragino Mincho ProN', serif; }
  .sk-sunmoon a { color: var(--goldText); }
  .sk-sunmoon .box, .sk-sunmoon .tbox, .sk-sunmoon .post, .sk-sunmoon .btn, .sk-sunmoon .navbtn, .sk-sunmoon .welcome, .sk-sunmoon input, .sk-sunmoon textarea, .sk-sunmoon .pop, .sk-sunmoon .dial { transition: background-color 1.6s ease, border-color 1.6s ease, box-shadow 1.6s ease; }
  .sk-sunmoon #sky { background: var(--bg); }
  .sk-sunmoon #sky .g { position: absolute; inset: 0; transition: opacity 1.6s ease-in-out; }
  .sk-sunmoon #sky .paper { position: absolute; inset: 0; background-size: 256px auto; mix-blend-mode: multiply; transition: opacity 1.6s ease-in-out; }
  .sk-sunmoon #sky .stars { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--star); transition: opacity 1.6s ease-in-out; }
  .sk-sunmoon #sky .orrery { position: absolute; left: 50%; top: 0; width: 390px; height: 360px; transform-origin: 50% 0; transform: translateX(-50%) scale(.52); transition: transform .5s ease-out; }
  .sk-sunmoon #sky .orrery svg { position: absolute; inset: 0; }
  .sk-sunmoon #sky .wheel { transform-origin: 195px 160px; transition: transform .6s ease-out; }
  .sk-sunmoon #sky .lines { fill: none; stroke: var(--skyLine); stroke-width: 1; opacity: .55; }
  .sk-sunmoon #sky .dots { fill: var(--skyLine); opacity: .6; }
  .sk-sunmoon #sky .sun, .sk-sunmoon #sky .moon { position: absolute; height: auto; transition: left 1.6s ease-in-out, top 1.6s ease-in-out, width 1.6s ease-in-out, opacity 1.6s ease-in-out, filter 1.6s ease-in-out; }
  .sk-sunmoon .dial { position: absolute; right: 12px; bottom: 14px; width: 64px; height: 64px; border-radius: 50%; background: var(--panel); box-shadow: 0 0 0 1px var(--gold), 0 0 0 4px var(--panel), 0 0 0 5px var(--line); }
  .sk-sunmoon .dial .d1 { fill: none; stroke: var(--line); stroke-width: .6; }
  .sk-sunmoon .dial .d2 { fill: none; stroke: var(--gold); stroke-width: .5; stroke-dasharray: 1.5 2.5; }
  .sk-sunmoon .dial .d3 { stroke: var(--gold); stroke-width: 1; }
  .sk-sunmoon .dial .d4 { stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; }
  .sk-sunmoon .dial .d5 { fill: var(--gold); }
  .sk-sunmoon .dial .d6 { fill: var(--panel); }
  .sk-sunmoon .dial .hand { transform-origin: 32px 32px; transition: transform .25s ease-out; }
  .sk-sunmoon .lat { font-family: 'Almendra SC', serif; font-size: 11px; letter-spacing: .28em; color: var(--goldText); }
  .sk-sunmoon .legend { font-family: 'Almendra', serif; }
  .sk-sunmoon .legend .lgt { font-family: 'Almendra SC', serif; letter-spacing: .2em; }
  .sk-sunmoon .ic { stroke-width: 1.1; }
  .sk-sunmoon .sacra-logo { width: 42px; height: 42px; background: var(--goldText); }
  .sk-sunmoon .head { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; text-align: right; }
  .sk-sunmoon .head .brand { display: flex; align-items: center; gap: 10px; }
  .sk-sunmoon .head .sacra { font-family: 'Almendra SC', serif; font-size: 34px; line-height: 1; letter-spacing: .1em; color: var(--head); }
  .sk-sunmoon .head h1 { font-weight: 400; font-size: 16px; letter-spacing: .36em; color: var(--head); }
  .sk-sunmoon .head p { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
  .sk-sunmoon .head p.lat { color: var(--goldText); }
  .sk-sunmoon .head h1, .sk-sunmoon .head p, .sk-sunmoon .head .sacra, .sk-sunmoon .nav .lat, .sk-sunmoon .legend { text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg); }
  .sk-sunmoon .nav.top { margin-bottom: 44px; }
  .sk-sunmoon .pgt { color: var(--head); font-size: 18px; letter-spacing: .2em; }
  .sk-sunmoon .sec { align-items: baseline; justify-content: center; gap: 10px; margin-bottom: 4px; }
  .sk-sunmoon .sec > span:last-child:not(.lat) { font-size: 14px; letter-spacing: .24em; color: var(--head); }
  .sk-sunmoon .box, .sk-sunmoon .tbox { position: relative; background: var(--panel); border: 3px double var(--gold); color: var(--ink); }
  .sk-sunmoon .box.list { padding: 12px 12px 4px; }
  .sk-sunmoon form.box, .sk-sunmoon .box.login, .sk-sunmoon .adminbox, .sk-sunmoon .lookbox { padding: 22px 16px 16px; }
  .sk-sunmoon .tbox { padding: 22px 16px 16px; text-align: center; }
  .sk-sunmoon .orn { width: 20px; height: 20px; line-height: 0; }
  .sk-sunmoon .orn svg { fill: none; stroke: var(--gold); }
  .sk-sunmoon .orn circle { fill: var(--gold); stroke: none; }
  .sk-sunmoon .orn.tl { left: 3px; top: 3px; } .sk-sunmoon .orn.tr { right: 3px; top: 3px; transform: scaleX(-1); }
  .sk-sunmoon .orn.bl { left: 3px; bottom: 3px; transform: scaleY(-1); } .sk-sunmoon .orn.br { right: 3px; bottom: 3px; transform: scale(-1, -1); }
  .sk-sunmoon .btn, .sk-sunmoon .navbtn { background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--rule); font-weight: 400; }
  .sk-sunmoon .btn.big, .sk-sunmoon .navbtn.primary, .sk-sunmoon .btn.like.on { background: var(--primary); color: var(--primaryInk); border-color: var(--gold); box-shadow: inset 0 0 0 3px var(--primary), inset 0 0 0 4px var(--gold); font-weight: 400; }
  .sk-sunmoon .btn.wide.big { min-height: 46px; font-size: 16px; letter-spacing: .22em; }
  .sk-sunmoon .btn.on:not(.like) { background: var(--sel); color: var(--head); border-color: var(--gold); box-shadow: inset 0 0 0 3px var(--sel), inset 0 0 0 4px var(--gold); }
  .sk-sunmoon .btn.on:not(.like)::before { content: ''; width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); flex: none; }
  .sk-sunmoon .navbtn .cnt { min-width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: var(--primaryInk); font-family: 'Almendra SC', serif; font-size: 12px; }
  .sk-sunmoon .welcome { padding: 4px 6px 4px 14px; background: var(--panel); border: 1px solid var(--line); }
  .sk-sunmoon .welcome b { font-weight: 400; color: var(--head); }
  .sk-sunmoon .badge { position: relative; display: inline-flex; width: 22px; height: 26px; align-items: center; justify-content: center; vertical-align: middle; }
  .sk-sunmoon .badge svg { position: absolute; inset: 0; fill: var(--sel); stroke: var(--gold); stroke-width: 1; }
  .sk-sunmoon .badge span { position: relative; margin-top: -3px; font-family: 'Almendra SC', serif; font-size: 11.5px; color: var(--head); }
  .sk-sunmoon .item { border-top: 1px solid var(--rule); }
  .sk-sunmoon .item .num { width: 38px; padding-top: 1px; font-family: 'Almendra SC', serif; font-size: 14px; color: var(--goldText); }
  .sk-sunmoon .item .t { color: var(--head); }
  .sk-sunmoon .meta, .sk-sunmoon .note, .sk-sunmoon .count, .sk-sunmoon .loading, .sk-sunmoon .ed { color: var(--muted); }
  .sk-sunmoon .meta { font-family: 'Almendra', 'New Tegomin', serif; font-size: 13px; letter-spacing: .03em; }
  .sk-sunmoon .red { color: var(--goldText); }
  .sk-sunmoon .name { color: var(--head); font-weight: 400; }
  .sk-sunmoon .trip { font-family: 'Almendra', serif; font-style: italic; color: var(--goldText); }
  .sk-sunmoon .foot .fl { display: block; width: 140px; height: 9px; background: linear-gradient(var(--line), var(--line)) left center / 62px 1px no-repeat, linear-gradient(var(--line), var(--line)) right center / 62px 1px no-repeat; position: relative; }
  .sk-sunmoon .foot .fl::after { content: ''; position: absolute; left: 50%; top: 1px; width: 6px; height: 6px; margin-left: -3px; background: var(--gold); transform: rotate(45deg); }
  .sk-sunmoon .foot p { margin: 0; color: var(--muted); }
  .sk-sunmoon hr { border-top-color: var(--line); opacity: .6; }
  .sk-sunmoon .orule { display: flex; align-items: center; gap: 10px; }
  .sk-sunmoon .orule span { flex: 1; border-top: 1px solid var(--line); }
  .sk-sunmoon .orule svg { fill: var(--gold); }
  .sk-sunmoon .tbox .ttl { font-size: 20px; line-height: 1.55; letter-spacing: .06em; }
  .sk-sunmoon .tbox .meta { font-size: 12px; line-height: 1.9; }
  .sk-sunmoon .tacts { justify-content: center; }
  .sk-sunmoon .tacts .linkbtn { border: 1px solid var(--line); background: var(--panel); padding: 0 12px; }
  .sk-sunmoon .post { background: var(--panel); border: 1px solid var(--line); }
  .sk-sunmoon .post .no { font-family: 'Almendra', serif; font-size: 20px; line-height: 1; color: var(--goldText); }
  .sk-sunmoon .post .date { font-family: 'Almendra', serif; font-size: 14px; letter-spacing: .04em; color: var(--muted); }
  .sk-sunmoon .post .b { line-height: 1.9; }
  .sk-sunmoon .post .gone { text-align: center; font-family: 'Almendra', 'New Tegomin', serif; color: var(--muted); }
  .sk-sunmoon .acts.tools { border-top: 1px solid var(--rule); padding-top: 8px; }
  .sk-sunmoon .linkbtn { color: var(--muted); }
  .sk-sunmoon .linkbtn.red { color: var(--goldText); }
  .sk-sunmoon .like { min-height: 42px; padding: 0 14px 0 10px; }
  .sk-sunmoon .imgs a { background: var(--field); border: 1px solid var(--line); padding: 4px; box-shadow: inset 0 0 0 4px var(--field), inset 0 0 0 5px var(--rule); }
  .sk-sunmoon .pop { background: var(--field); color: var(--ink); border: 3px double var(--line); }
  .sk-sunmoon .pop .lat { font-size: 10.5px; letter-spacing: .24em; }
  .sk-sunmoon label { color: var(--muted); }
  .sk-sunmoon input[type=text], .sk-sunmoon textarea { border: 1px solid var(--line); border-radius: 0; background: var(--field); color: var(--ink); box-shadow: inset 0 1px 3px rgba(40, 25, 10, .12); }
  .sk-sunmoon fieldset { border: 1px solid var(--line); }
  .sk-sunmoon legend { color: var(--goldText); }
  .sk-sunmoon .check, .sk-sunmoon .parts label, .sk-sunmoon .skins label { color: var(--ink); }
  .sk-sunmoon input[type=radio], .sk-sunmoon input[type=checkbox] { accent-color: var(--gold); }
  .sk-sunmoon .count { font-family: 'Almendra', serif; font-size: 15px; }
  .sk-sunmoon .req { border-bottom: 1px solid var(--rule); }
  .sk-sunmoon .adminbox { background: var(--panel); border-color: var(--gold); }
  .sk-sunmoon .palrow input[type=text] { font-family: 'Almendra', monospace; }

     iPhoneはこの画面の保存データをアプリを閉じると消してしまう。そこで入口ページにも預けておく */
  const TOP_ORIGIN = (() => {
    try {
      if (window.top === window) return null;
      const a = location.ancestorOrigins; const o = a && a.length ? a[a.length - 1] : '';
      return /^https:\/\/[a-z0-9-]+\.github\.io$/i.test(o) ? o : null;
    } catch (e) { return null; }

  function toTop(key, value) { if (TOP_ORIGIN) try { window.top.postMessage({ sacra: 'set', key, value }, TOP_ORIGIN); } catch (e) {} }

  function restoreFromTop() {
    return new Promise((resolve) => {
      if (!TOP_ORIGIN) return resolve();
      const done = () => { window.removeEventListener('message', onMsg); resolve(); };

        if (e.origin !== TOP_ORIGIN || !e.data || e.data.sacra !== 'data') return;

        done();
      };
      window.addEventListener('message', onMsg);
      try { window.top.postMessage({ sacra: 'get' }, TOP_ORIGIN); } catch (e) { return done(); }
      setTimeout(done, 800);
    });
  }

  /* ══════════ 着せ替え（スキン）══════════
     一人ひとりが設定画面で選ぶ。選んだものは端末とサーバー（getLook / saveLook）に保存する。
     ②③は端末の時刻で色が変わる：日の出 4〜7時、朝 7〜16時、日の入り 16〜19時、夜 19〜4時 */
  let LOOK = { skin: 'retro', palettes: {} };
  try { const l = JSON.parse(localStorage.getItem('sacra_look') || 'null'); if (l && l.skin) LOOK = l; } catch (e) {}
  const PHASES = ['dawn', 'morning', 'sunset', 'night'];
  const PHASE_JA = { dawn: '日の出', morning: '朝', sunset: '日の入り', night: '夜' };
  const PHASE_HOURS = { dawn: '4〜7時', morning: '7〜16時', sunset: '16〜19時', night: '19〜4時' };
  function phaseNow() { const h = new Date().getHours(); return h >= 4 && h < 7 ? 'dawn' : h >= 7 && h < 16 ? 'morning' : h >= 16 && h < 19 ? 'sunset' : 'night'; }
  const phase = () => state.phaseOverride || phaseNow();

  /* 色の計算：文字が読みにくいときだけ白か黒の方向へ寄せる */

        '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">' + S.slots(k).map((label, i) =>
          '<label class="palrow"><span>' + label + '</span><input type="color" data-ci="' + i + '" value="' + pal[k][i] + '"><input type="text" data-hi="' + i + '" value="' + pal[k][i] + '" maxlength="7" aria-label="' + label + 'の色コード"></label>').join('') + '</div>' +
        '<button type="button" class="btn" id="palReset" style="margin-top:8px">' + (S.phased ? 'この時間帯を' : '') + 'デフォルトに戻す</button></fieldset>' : '') +
      '<p class="note" style="margin:0" id="lookMsg">選ぶとすぐに変わり、自動で保存されます。</p>';
  }
  function bindLookEditor() {
    const msg = () => document.getElementById('lookMsg');
    const redraw = () => { const y = window.scrollY; viewSettings(); window.scrollTo(0, y); };
    app.querySelectorAll('input[name=skin]').forEach((r) => { r.onchange = () => { LOOK.skin = r.value; state.phaseOverride = null; applyLook(); redraw(); saveLookSoon(msg()); }; });
    app.querySelectorAll('.paltabs [data-ph]').forEach((b) => { b.onclick = () => { state.phaseOverride = b.dataset.ph; applyPhase(); redraw(); }; });
    const setColor = (i, v) => {
      const sk = skin(), k = palKey(), pal = palettes();
      pal[k][i] = v.toUpperCase();
      LOOK.palettes = LOOK.palettes || {}; LOOK.palettes[sk] = LOOK.palettes[sk] || {}; LOOK.palettes[sk][k] = pal[k];
      applyPhase();
      const c = app.querySelector('[data-ci="' + i + '"]'), h = app.querySelector('[data-hi="' + i + '"]');
      if (c) c.value = v; if (h && h !== document.activeElement) h.value = v.toUpperCase();
      saveLookSoon(msg());
    };
    app.querySelectorAll('[data-ci]').forEach((c) => { c.oninput = () => setColor(Number(c.dataset.ci), c.value); });
    app.querySelectorAll('[data-hi]').forEach((h) => { h.oninput = () => { if (/^#[0-9A-Fa-f]{6}$/.test(h.value)) setColor(Number(h.dataset.hi), h.value); }; });
    const rs = document.getElementById('palReset');
    if (rs) rs.onclick = () => { const sk = skin(); if (LOOK.palettes && LOOK.palettes[sk]) delete LOOK.palettes[sk][palKey()]; applyPhase(); redraw(); saveLookSoon(msg()); };
  }

  /* ── サーバー呼び出し ── */
  // サーバー呼び出し：毎回セッションを付けて送る。期限切れならログイン画面へ
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler((e) => {
        if (String(e && e.message).indexOf('SESSION_EXPIRED') >= 0) { saveSession(null); state.me = null; showLogin(); }
        reject(e);
      });
      if (fn === 'getLoginUrl' || fn === 'checkLogin') runner[fn](...args);
      else runner[fn](state.session, ...args);
    });
  }

  /* ── ログイン画面 ──
     ボタンを押すと Google のログイン画面が別タブで開く。ログインが済んだら、この画面が自動で気づいて先へ進む */
  let pollTimer = null;
  function showLogin() {
    app.innerHTML = header() +
      '<div class="box login"><p style="margin:0;font-size:14px">掲示板を使うには、Googleアカウントでログインしてください。</p>' +
      '<button class="btn big" id="loginBtn" style="min-width:240px">Googleでログイン</button>' +
      '<p class="note" id="loginMsg" style="margin:0;text-align:center"></p></div>';
    document.getElementById('loginBtn').onclick = startLogin;
  }
  async function startLogin() {
    const msg = document.getElementById('loginMsg');
    const arr = new Uint8Array(16); crypto.getRandomValues(arr);
    const nonce = Array.from(arr, (b) => b.toString(16).padStart(2, '0')).join('');
    try {
      const url = await call('getLoginUrl', nonce);
      const w = window.open(url, '_blank');
      msg.innerHTML = '別のタブでログインしてください。済んだら、この画面に戻ってきてください。' +
        (w ? '' : '<br><a href="' + esc(url) + '" target="_blank" rel="noopener">ログイン画面が開かない場合はこちら</a>');
      clearInterval(pollTimer);
      const until = Date.now() + 10 * 60 * 1000;
      let busy = false;
      // ログインが済んだか確かめる。エラーのときは理由を画面に出す
      const check = async (manual) => {
        if (busy) return; busy = true;
        try {
          const r = await call('checkLogin', nonce);
          if (r) { clearInterval(pollTimer); document.removeEventListener('visibilitychange', onBack); saveSession(r.session); state.me = r.me; route(); return; }
          if (manual) msg.innerHTML = 'まだログインが確認できません。ログインのタブで最後まで進んでから、もう一度押してください。<br><button class="btn" id="checkNow" style="margin-top:8px">ログインが済んだら押してください</button>';
        } catch (e) {
          msg.innerHTML = 'サーバーと通信できませんでした：' + esc(e && e.message ? e.message : e) + '<br><button class="btn" id="checkNow" style="margin-top:8px">もう一度確かめる</button>';
        } finally {
          busy = false;
          const b = document.getElementById('checkNow'); if (b) b.onclick = () => check(true);
        }
      };
      // このタブに戻ってきたらすぐ確かめる（裏にあるあいだ、ブラウザがタイマーを止めることがあるため）
      const onBack = () => { if (document.visibilityState === 'visible') check(false); };
      document.addEventListener('visibilitychange', onBack);
      pollTimer = setInterval(() => {
        if (Date.now() > until) { clearInterval(pollTimer); document.removeEventListener('visibilitychange', onBack); msg.textContent = '時間切れです。もう一度ボタンを押してください。'; return; }
        check(false);
      }, 2500);
      msg.innerHTML += '<br><button class="btn" id="checkNow" style="margin-top:8px">ログインが済んだら押してください</button>';
      document.getElementById('checkNow').onclick = () => check(true);
    } catch (e) { msg.textContent = 'ログインを始められませんでした：' + (e && e.message ? e.message : e); }
  }

  /* ── 文字の安全な表示 ── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // URLの自動リンクと >>番号 のアンカー
  function renderBody(text) {
    let h = esc(text);
    h = h.replace(/(https?:\/\/[^\s<]+)/g, (u) => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>');
    h = h.replace(/&gt;&gt;(\d{1,4})/g, (m, n) => '<a href="#" class="anchor" data-no="' + n + '">&gt;&gt;' + n + '</a>');
    return h;
  }
  /* ── 画像：選んだ写真を長辺1280pxのJPEGに縮小してから送る ── */
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('画像を読み込めませんでした'));
      fr.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('この画像は使えません'));
        img.onload = () => {
          const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  // 画像を選ぶ部品。picker.list に縮小済みの画像がたまる
  function imagePicker(boxId) {
    const picker = { list: [] };
    const box = document.getElementById(boxId);
    box.innerHTML = '<input type="file" accept="image/*" multiple hidden><button type="button" class="btn">画像を添付（4枚まで）</button><div class="previews"></div>';
    const input = box.querySelector('input'), btn = box.querySelector('button'), prev = box.querySelector('.previews');
    const draw = () => {
      prev.innerHTML = picker.list.map((d, i) => '<div><img src="' + d + '" alt=""><button type="button" data-i="' + i + '" aria-label="この画像を外す">×</button></div>').join('');
      prev.querySelectorAll('button').forEach((b) => { b.onclick = () => { picker.list.splice(Number(b.dataset.i), 1); draw(); }; });
      btn.textContent = '画像を添付（' + picker.list.length + '/4）';
    };
    btn.onclick = () => input.click();
    input.onchange = async () => {
      const files = Array.from(input.files).slice(0, 4 - picker.list.length);
      btn.disabled = true; btn.textContent = '画像を準備中…';
      try { for (const f of files) picker.list.push(await compressImage(f)); } catch (e) { showError(e); }
      input.value = ''; btn.disabled = false; draw();
    };
    draw();
    return picker;
  }
  const imgUrl = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w;

  function showError(e) {
    const msg = (e && e.message) ? e.message : String(e);
    const div = document.createElement('div');
    div.className = 'err';
    div.textContent = 'エラー：' + msg;
    app.prepend(div);
    window.scrollTo(0, 0);
  }

  /* ── 画面の切り替え ──
     GASのWebアプリは枠（iframe）の中で動くため、location.hash ではなく
     google.script.history で画面を切り替える（ブラウザの「戻る」も効く） */
  let current = '#/';
  function go(hash) {
    current = hash;
    try { google.script.history.push({ h: hash }, null, hash.slice(1)); } catch (e) {}
    route();
  }
  google.script.history.setChangeHandler((e) => {
    current = e.location && e.location.hash ? '#' + e.location.hash : '#/';
    route();
  });
  // 画面内の「#/〜」リンクは、ページ移動させずに go() で切り替える
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute('href'));
  });

  async function route() {
    hidePop();
    if (state.phaseOverride) { state.phaseOverride = null; applyPhase(); }
    window.scrollTo(0, 0);
    const h = current || '#/';
    if (!state.session) return showLogin();
    try {
      if (!state.me) state.me = await call('getMe');
      // 自分の着せ替えをサーバーから読む（別の端末で変えた分も反映する）
      if (!state.lookLoaded) {
        state.lookLoaded = true;
        try {
          const l = await call('getLook');
          if (l && JSON.stringify(l) !== JSON.stringify(LOOK)) { LOOK = l; try { localStorage.setItem('sacra_look', JSON.stringify(l)); } catch (e) {} toTop('sacra_look', JSON.stringify(l)); applyLook(); }
        } catch (e) {}
      }
      if (h.startsWith('#/t/')) return await viewThread(h.slice(4));
      if (h === '#/new') return viewNew();
      if (h === '#/settings') return viewSettings();
      if (h === '#/requests') return await viewRequests();
      return await viewList();
    } catch (e) {
      if (!state.session) return;
      app.innerHTML = '';
      showError(e);
    }
  }

  /* ── スレ一覧 ── */

  function renderList() {

    const sorts = retro() ? [['new', '新しい順'], ['old', '古い順'], ['many', 'レスが多い順'], ['few', 'レスが少ない順']] : (S.sortLabels || [['new', '新しい順'], ['old', '古い順'], ['many', 'レス多い'], ['few', 'レス少ない']]);

      (retro() ? '<hr><p class="meta" style="text-align:center;margin:0">Sacra練習掲示板 試運転版</p>' : S.foot());

  function renderThread() {
    const t = state.thread;
    const attr = '名無しの名前：' + esc(t.anonName) + ' ／ 名前表示：' + (t.showName ? 'あり' : 'なし') + ' ／ パート表示：' + (t.showPart ? 'あり' : 'なし') + ' ／ いいね数表示：' + (t.showLikes ? 'あり' : 'なし');
    const limit = (state.me && state.me.board && state.me.board.postLimit) || 5;

      if (p.deleted) return '<div class="post" id="r' + p.no + '">' + head + '<p class="gone">(✿´꒳`)ﾉ°*❀ このレスは桜吹雪にさらわれました ❀</p></div>';
      const likeLabel = (retro() ? (p.likedByMe ? '★' : '☆') : icon('like', p.likedByMe)) + 'いいね' + (t.showLikes ? ' ' + p.likeCount : '');
      const likers = t.showLikes && p.likers.length ? '<span class="meta">' + esc(p.likers.join('、')) + '</span>' : '';

    const postsHtml = hidden ? posts.replace('</div><div class="post"', '</div>' + toggle + '<div class="post"') : posts + toggle;

    app.querySelectorAll('[data-like]').forEach((b) => { b.onclick = async () => { b.disabled = true; try { await call('toggleLike', b.dataset.like); state.thread = await call('getThread', t.id); renderThread(); } catch (err) { showError(err); } }; });
    app.querySelectorAll('[data-reply]').forEach((b) => { b.onclick = () => { body.value += (body.value && !body.value.endsWith('\n') ? '\n' : '') + '>>' + b.dataset.reply + '\n'; body.oninput(); body.focus(); body.scrollIntoView({ block: 'center' }); }; });
    app.querySelectorAll('[data-del]').forEach((b) => { b.onclick = async () => { if (!confirm('この書き込みを削除しますか？')) return; try { await call('deletePost', b.dataset.del); state.thread = await call('getThread', t.id); renderThread(); } catch (err) { showError(err); } }; });
    app.querySelectorAll('[data-edit]').forEach((b) => { b.onclick = () => startEdit(b.dataset.edit); });
    app.querySelectorAll('a.anchor').forEach((a) => { a.onclick = (e) => { e.preventDefault(); showPop(Number(a.dataset.no)); }; });
    const rn = document.getElementById('rename');
    if (rn) rn.onclick = async () => { const v = prompt('新しいタイトル（100文字まで）', t.title); if (v == null) return; try { await call('renameThread', t.id, v); state.thread = await call('getThread', t.id); renderThread(); } catch (err) { showError(err); } };
    const dt = document.getElementById('delThread');
    if (dt) dt.onclick = async () => { if (!confirm('このスレッドを削除しますか？\n削除すると、スレッドもレスも一覧から見えなくなります。')) return; try { await call('deleteThread', t.id); go('#/'); } catch (err) { showError(err); } };
  }

  async function askRequest(type, targetId) {
    const label = type === 'thread' ? 'このスレッド' : 'この書き込み';
    const reason = prompt(label + 'の削除を管理者に申請します。理由を入力してください（必須・200文字まで）');
    if (reason == null) return;
    if (!reason.trim()) { alert('理由を入力してください'); return; }
    try { await call('requestDelete', type, targetId, reason); alert('削除申請を送りました。管理者が確認します。'); } catch (err) { showError(err); }
  }

  /* ── 削除申請一覧（管理者）── */
  async function viewRequests() {
    app.innerHTML = topNav() + '<p class="loading">読み込み中…</p>';
    const list = await call('listRequests');
    const st = { pending: '<b class="red">未処理</b>', approved: '削除済み', rejected: '却下' };
    app.innerHTML = topNav() + '<h2 class="pgt">削除申請一覧</h2>' +
      '<div class="box">' + sec('petitions') + (list.length ? list.map((r) =>
        '<div class="req"><span>' + st[r.status] + ' ／ ' + (r.type === 'thread' ? 'スレ' : 'レス') + 'の削除申請 ／ <span class="meta">' + esc(r.created) + '</span></span>' +
        '<span>スレ：<a href="#/t/' + esc(r.threadId) + '">' + esc(r.threadTitle) + '</a>' + (r.type === 'post' ? '　レス ' + esc(r.postNo) + '（' + esc(r.postName) + '）' : '') + '</span>' +
        (r.type === 'post' ? '<span class="meta" style="white-space:pre-wrap">' + esc(r.postBody) + '</span>' : '') +
        '<span>理由：' + esc(r.reason) + '<span class="meta">（申請者：' + esc(r.requester) + '）</span></span>' +
        (r.status === 'pending' ? '<div class="row"><button class="btn" data-rej="' + r.id + '">却下する</button><button class="btn big" data-ok="' + r.id + '">削除する</button></div>' : '<span class="meta">処理：' + esc(r.handled) + '</span>') +
        '</div>').join('') : '<p class="meta" style="padding:10px">削除申請はありません。</p>') + '</div>';
    const act = async (id, action) => { try { await call('handleRequest', id, action); state.me = await call('getMe'); viewRequests(); } catch (err) { showError(err); } };
    app.querySelectorAll('[data-ok]').forEach((b) => { b.onclick = () => { if (confirm('申請どおり削除しますか？')) act(b.dataset.ok, 'approve'); }; });
    app.querySelectorAll('[data-rej]').forEach((b) => { b.onclick = () => act(b.dataset.rej, 'reject'); });
  }

  function startEdit(postId) {
    const p = state.thread.posts.find((x) => x.id === postId);
    const el = app.querySelector('[data-body="' + postId + '"]');
    el.outerHTML = '<div class="form" style="margin-left:16px;padding:0"><textarea id="eBody" rows="4" maxlength="1000">' + esc(p.body) + '</textarea><div class="row"><button class="btn" id="eCancel">やめる</button><button class="btn big" id="eSave">保存</button></div></div>';
    document.getElementById('eCancel').onclick = () => renderThread();
    document.getElementById('eSave').onclick = async () => {
      try { await call('editPost', postId, document.getElementById('eBody').value); state.thread = await call('getThread', state.thread.id); renderThread(); } catch (err) { showError(err); }
    };
  }

  function showPop(no) {
    const p = state.thread.posts.find((x) => x.no === no);
    const pop = document.getElementById('pop');
    if (!p) { pop.innerHTML = '&gt;&gt;' + no + ' のレスはありません'; }
    else if (p.deleted) { pop.innerHTML = no + ' ：このレスは桜吹雪にさらわれました'; }
    else {
      pop.innerHTML = (retro() ? '' : '<span class="lat">&gt;&gt;' + p.no + '</span>') + '<div>' + p.no + ' ：<span class="name">' + esc(p.name) + '</span>' + partBadge(p.part) + '：<span class="meta">' + esc(p.date) + '</span></div><div style="white-space:pre-wrap">' + renderBody(p.body) + '</div><div style="text-align:right"><button class="linkbtn" id="popClose">' + lb('閉じる') + '</button></div>';
    }
    pop.hidden = false;
    const c = document.getElementById('popClose');
    if (c) c.onclick = hidePop;
  }
  function hidePop() { document.getElementById('pop').hidden = true; }

  /* ── スレ立て ── */
  function viewNew() {
    app.innerHTML = topNav() + '<h2 class="pgt">新しいスレッドを立てる</h2>' +
      '<form class="box" id="newForm">' + sec('newthread') +
      '<label>スレッドのタイトル<input type="text" id="nTitle" maxlength="100"></label><p class="count"><span id="nTitleC">0</span>/100</p>' +
      '<fieldset><legend>スレの属性</legend>' +
      '<label>名無しの名前（名前欄が空のときの表示名）<input type="text" id="nAnon" maxlength="30" placeholder="' + ANON + '"></label>' +
      '<label class="check"><input type="checkbox" id="nShowName" checked>名前を表示する</label>' +
      '<label class="check"><input type="checkbox" id="nShowPart" checked>パートを表示する</label>' +
      '<label class="check"><input type="checkbox" id="nShowLikes">いいね数を表示する</label>' +
      '<p class="note" style="margin:0">※名前を表示しない場合、全員が名無しの名前になり、トリップも使えません<br>※いいね数を表示しない場合、いいねした人も表示されません</p></fieldset>' +
      '<label>名前（空欄なら名無しの名前）<input type="text" id="nName" maxlength="60" placeholder="' + ANON + '" value="' + esc((state.me && state.me.name) || '') + '"></label>' +
      '<label>1レス目の本文<textarea id="nBody" rows="6" maxlength="1000"></textarea></label><p class="count"><span id="nBodyC">0</span>/1000</p>' +
      '<div id="nImgs" class="form" style="padding:0"></div>' +
      '<button class="btn big" type="submit">スレッドを立てる</button></form>';
    const ti = document.getElementById('nTitle'), bo = document.getElementById('nBody');
    const npicker = imagePicker('nImgs');
    ti.oninput = () => { document.getElementById('nTitleC').textContent = ti.value.length; };
    bo.oninput = () => { document.getElementById('nBodyC').textContent = bo.value.length; };
    document.getElementById('newForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const id = await call('createThread', {
          title: ti.value, body: bo.value, name: document.getElementById('nName').value,
          anonName: document.getElementById('nAnon').value,
          showName: document.getElementById('nShowName').checked,
          showPart: document.getElementById('nShowPart').checked,
          showLikes: document.getElementById('nShowLikes').checked,
          images: npicker.list
        });
        go('#/t/' + id);
      } catch (err) { showError(err); btn.disabled = false; }
    };
  }

  /* ── 設定 ── */
  function viewSettings() {
    const me = state.me;
    const parts = [['', 'なし'], ['S', 'S'], ['A', 'A'], ['T', 'T'], ['B', 'B']];
    app.innerHTML = topNav() + '<h2 class="pgt">設定</h2>' +
      '<p class="meta" style="margin:0;font-size:13px">ログイン中のアカウント：' + esc(me.email) + '</p>' +
      '<form class="box" id="meForm">' + sec('persona') +
      '<label>名前<input type="text" id="sName" maxlength="60" value="' + esc(me.name) + '"><span class="note">※書き込むときの名前欄に自動で入ります。いいねした人の一覧にも表示されます<br>※「名前#合言葉」と登録すると、書き込みに自動でトリップが付きます（一覧などには # より前だけが出ます）</span></label>' +
      '<fieldset><legend>パート</legend><div class="parts">' +
      parts.map((p) => '<label><input type="radio" name="part" value="' + p[0] + '"' + (me.part === p[0] ? ' checked' : '') + '>' + p[1] + '</label>').join('') +
      '</div></fieldset>' +
      '<button class="btn big" type="submit">保存する</button></form>' +
      (me.isAdmin ? '<div class="box adminbox">' + sec('admin') + '<p style="margin:0"><a href="#/requests">' + (retro() ? '★' : '') + '削除申請一覧（未処理 ' + (me.pendingRequests || 0) + '件）</a></p><p class="note" style="margin:0">スレ詳細画面にも「スレ削除」「管理者削除」のボタンが表示されます。</p><fieldset><legend>表示件数</legend>' +
        '<label class="palrow" style="grid-template-columns:9em 6em"><span>スレ一覧の表示スレ数</span><input type="text" inputmode="numeric" id="bList" value="' + me.board.listLimit + '"></label>' +
        '<label class="palrow" style="grid-template-columns:9em 6em;margin-top:6px"><span>スレ詳細の表示レス数</span><input type="text" inputmode="numeric" id="bPost" value="' + me.board.postLimit + '"></label>' +
        '<p class="note" style="margin:6px 0">スレ詳細の通常表示は「1レス目＋最新の◯件」です。どちらも、見る人が「全部表示」に切り替えられます。</p>' +
        '<button type="button" class="btn" id="bSave">表示件数を保存する</button><span class="note" id="bMsg"></span></fieldset></div>' : '') +
      '<div class="box lookbox">' + sec('look') + lookEditor() + '</div>' +
      '<button class="btn" id="logout">ログアウト</button>' +
      '<p class="note" style="text-align:right;margin:0">……書き込むときの名前に「#」と<br>あなただけの合言葉を添えると、<br>花びらに秘密の印が刻まれるとか。</p>';
    bindLookEditor();
    const bs = document.getElementById('bSave');
    if (bs) bs.onclick = async () => {
      try {
        me.board = await call('saveBoard', { listLimit: document.getElementById('bList').value, postLimit: document.getElementById('bPost').value });
        document.getElementById('bMsg').textContent = ' 保存しました';
      } catch (err) { showError(err); }
    };
    document.getElementById('logout').onclick = async () => {
      try { await call('logout'); } catch (e) {}
      saveSession(null); state.me = null; showLogin();
    };
    document.getElementById('meForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const part = (app.querySelector('input[name=part]:checked') || {}).value || '';
        state.me = await call('saveMe', document.getElementById('sName').value, part);
        go('#/');
      } catch (err) { showError(err); }
    };
  }

  setInterval(applyPhase, 60 * 1000);
  restoreFromTop().then(() => {
    applyLook();
    google.script.url.getLocation((loc) => {
      current = loc && loc.hash ? '#' + loc.hash : '#/';
      route();
    });
  });
</script>
</body>
</html>
